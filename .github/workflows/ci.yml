name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit and integration tests on in-memory PostgreSQL (PGlite). No external services.
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: pglite://memory
          BETTER_AUTH_SECRET: ci-build-only-secret-not-used-at-runtime-000000

  postgres:
    name: Migrations and integration tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: campaignlens
          POSTGRES_PASSWORD: campaignlens
          POSTGRES_DB: campaignlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campaignlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://campaignlens:campaignlens@localhost:5432/campaignlens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Applies ./drizzle to a real server (tests/global-setup.ts), then runs the same suite through node-postgres.
      - run: npm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the app and runs it against a fresh embedded database. No paid or external calls.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
